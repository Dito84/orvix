<h2 mat-dialog-title class="parental-pin-dialog-title">
    <mat-icon>lock</mat-icon>
    {{ 'PARENTAL_CONTROL.PIN_PROMPT_TITLE' | translate }}
</h2>
<mat-dialog-content>
    @if (data.messageKey) {
        <p>{{ data.messageKey | translate }}</p>
    }
    <mat-form-field appearance="outline" class="parental-pin-field">
        <mat-label>{{ 'PARENTAL_CONTROL.PIN_LABEL' | translate }}</mat-label>
        <input
            matInput
            #pinInput
            type="password"
            inputmode="numeric"
            maxlength="8"
            autocomplete="off"
            (keyup.enter)="confirm()"
        />
    </mat-form-field>
    @if (hasError()) {
        <p class="parental-pin-error">
            {{ 'PARENTAL_CONTROL.PIN_INCORRECT' | translate }}
        </p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">{{ 'CANCEL' | translate }}</button>
    <button
        mat-flat-button
        color="primary"
        [disabled]="isVerifying()"
        (click)="confirm()"
    >
        {{ 'PARENTAL_CONTROL.CONFIRM_BUTTON' | translate }}
    </button>
</mat-dialog-actions>
